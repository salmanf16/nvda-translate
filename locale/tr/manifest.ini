summary = "Çevir"
description = """NVDA için ultra hızlı ve hafif bir çevrimiçi çeviri eklentisi. Başlangıçta Yannick Plassiard tarafından oluşturulan bu değiştirilmiş sürüm, yüksek hızlı bulut motorları kullanılarak hızlı gerçek zamanlı çeviriler için optimize edildi. Olağanüstü çalışmasından dolayı orijinal geliştiriciye özel teşekkürler ve tam kredi. İnternet bağlantısı gerektirir."""

changelog = '''
- Düzeltildi: Latin alfabesiyle yazılmış oyunların (İspanyolca, Fransızca, Almanca, İtalyanca, Portekizce vb.) hedef dile doğru şekilde çevrilmesi için geliştirilmiş çoklu dil otomatik algılama.
- Performans: Eski harf çevirisi yapılmış terimleri önlemek için çeviri önbelleği temizlendi ve optimize edildi.
- Düzeltildi: ASCII oyun metni için kaynak dil yönlendirmesi.
