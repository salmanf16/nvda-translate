summary = "Çevir"
description = """NVDA için ultra hızlı ve hafif bir çevrimiçi çeviri eklentisi. Başlangıçta Yannick Plassiard tarafından oluşturulan bu değiştirilmiş sürüm, yüksek hızlı bulut motorları kullanılarak hızlı gerçek zamanlı çeviriler için optimize edildi. Olağanüstü çalışmasından dolayı orijinal geliştiriciye özel teşekkürler ve tam kredi. İnternet bağlantısı gerektirir."""

changelog = '''
- Eklendi: Google Gemini (gemini-3.5-flash), OpenAI ChatGPT (gpt-5.4-mini) ve ayarlarda dinamik model getirme özelliğine sahip DeepL çeviri motorları desteği.
- Eklendi: Ukraynaca çeviri George-br tarafından sağlanmıştır.
- Düzeltildi: Çeviriler artık sürekli okuma sırasında doğru şekilde çalışıyor (Tümünü Söyle).
- Değiştirildi: Manuel çevirileri korumak amacıyla, insanlar tarafından çevrilen yerel ayarlar için otomatik makine çevirisi devre dışı bırakıldı.
