summary = "Çevir"
description = """NVDA için ultra hızlı ve hafif bir çevrimiçi çeviri eklentisi. Başlangıçta Yannick Plassiard tarafından oluşturulan bu değiştirilmiş sürüm, yüksek hızlı bulut motorları kullanılarak hızlı gerçek zamanlı çeviriler için optimize edildi. Olağanüstü çalışmasından dolayı orijinal geliştiriciye özel teşekkürler ve tam kredi. İnternet bağlantısı gerektirir."""
