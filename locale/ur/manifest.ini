- فکسڈ: ترجمہ اب مسلسل پڑھنے کے دوران صحیح طریقے سے کام کرتا ہے (سب کہو)۔
- تبدیل کر دیا گیا: دستی ترجمے کی حفاظت کے لیے انسانی ترجمہ شدہ جگہوں کے لیے خودکار مشینی ترجمہ کو غیر فعال کر دیا گیا۔
