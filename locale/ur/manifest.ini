summary = "ترجمہ کریں۔"
description = """NVDA کے لیے ایک انتہائی تیز اور ہلکا پھلکا آن لائن ترجمہ ایڈون۔ اصل میں Yannick Plassiard کے ذریعہ تخلیق کیا گیا، اس ترمیم شدہ ورژن کو تیز رفتار کلاؤڈ انجنوں کا استعمال کرتے ہوئے ریئل ٹائم ترجمہ کے لیے بہتر بنایا گیا ہے۔ خصوصی شکریہ اور مکمل کریڈٹ اصل ڈویلپر کو اس کے غیر معمولی کام کے لیے جاتا ہے۔ انٹرنیٹ کنکشن کی ضرورت ہے۔"""

changelog = '''
- فکسڈ: لاطینی اسکرپٹ گیمز (ہسپانوی، فرانسیسی، جرمن، اطالوی، پرتگالی، وغیرہ) کے لیے ٹارگٹ لینگوئج میں درست ترجمہ کرنے کے لیے بہتر کثیر زبان کی خودکار شناخت۔
- کارکردگی: باسی نقل کی اصطلاحات کو روکنے کے لیے ترجمے کے کیشے کو صاف اور بہتر بنایا گیا۔
- فکسڈ: ASCII گیم ٹیکسٹ کے لیے ماخذ زبان کی روٹنگ۔
'''
