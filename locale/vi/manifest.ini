summary = "Dịch"
description = """Một tiện ích dịch trực tuyến cực nhanh và nhẹ dành cho NVDA. Ban đầu được tạo bởi Yannick Plasiard, phiên bản sửa đổi này đã được tối ưu hóa để dịch nhanh theo thời gian thực bằng cách sử dụng công cụ đám mây tốc độ cao. Lời cảm ơn đặc biệt và ghi nhận đầy đủ dành cho nhà phát triển ban đầu vì công việc đặc biệt của anh ấy. Yêu cầu kết nối internet."""

changelog = '''
