summary = "अनुवाद"
description = """एनवीडीए के लिए एक अत्यंत तेज़ और हल्का ऑनलाइन अनुवाद ऐडऑन। मूल रूप से यानिक प्लासीर्ड द्वारा निर्मित, इस संशोधित संस्करण को उच्च गति वाले क्लाउड इंजनों का उपयोग करके तीव्र वास्तविक समय अनुवाद के लिए अनुकूलित किया गया है। मूल डेवलपर को उसके असाधारण कार्य के लिए विशेष धन्यवाद और पूरा श्रेय जाता है। इंटरनेट कनेक्शन की आवश्यकता है."""

changelog = '''
- जोड़ा गया: सेटिंग्स में डायनामिक मॉडल लाने के साथ Google जेमिनी (जेमिनी-3.5-फ्लैश), ओपनएआई चैटजीपीटी (जीपीटी-5.4-मिनी), और डीपएल ट्रांसलेशन इंजन के लिए समर्थन।
- जोड़ा गया: यूक्रेनी अनुवाद जॉर्ज-ब्र द्वारा योगदान दिया गया।
- ठीक किया गया: अनुवाद अब लगातार पढ़ने के दौरान सही ढंग से काम करते हैं (सभी कहें)।
- परिवर्तित: मैन्युअल अनुवादों की सुरक्षा के लिए मानव-अनुवादित स्थानों के लिए स्वचालित मशीन अनुवाद अक्षम।
