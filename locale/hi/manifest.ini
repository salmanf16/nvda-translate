summary = "अनुवाद"
description = """एनवीडीए के लिए एक अत्यंत तेज़ और हल्का ऑनलाइन अनुवाद ऐडऑन। मूल रूप से यानिक प्लासीर्ड द्वारा निर्मित, इस संशोधित संस्करण को उच्च गति वाले क्लाउड इंजनों का उपयोग करके तीव्र वास्तविक समय अनुवाद के लिए अनुकूलित किया गया है। मूल डेवलपर को उसके असाधारण कार्य के लिए विशेष धन्यवाद और पूरा श्रेय जाता है। इंटरनेट कनेक्शन की आवश्यकता है."""

changelog = '''
- ठीक किया गया: HTTP 429 दर सीमा और वैश्विक Google अनुवाद अवरोधन (अनुवाद और त्वरित अनुवाद दोनों आउटेज को ठीक करना) को बायपास करने में मल्टी-टियर Google एंडपॉइंट विफलता।
- ठीक किया गया: क्रोम एक्सटेंशन डिक्शनरी एंडपॉइंट और मानक अनुवाद बैच खंडों का समर्थन करने वाला बहु-प्रारूप प्रतिक्रिया पार्सर।
- प्रदर्शन: अल्ट्रा-फास्ट सब-100 एमएस वास्तविक समय अनुवाद के लिए कई Google एज नोड्स में एसएसएल कनेक्शन पूलिंग।
'''
