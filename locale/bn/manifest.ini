summary = "অনুবাদ করুন"
description = """এনভিডিএর জন্য একটি অতি-দ্রুত এবং লাইটওয়েট অনলাইন অনুবাদ অ্যাডন। মূলত Yannick Plassiard দ্বারা তৈরি, এই পরিবর্তিত সংস্করণটি উচ্চ-গতির ক্লাউড ইঞ্জিন ব্যবহার করে দ্রুত রিয়েল-টাইম অনুবাদের জন্য অপ্টিমাইজ করা হয়েছে। বিশেষ ধন্যবাদ এবং সম্পূর্ণ কৃতিত্ব মূল বিকাশকারীকে তার ব্যতিক্রমী কাজের জন্য। একটি ইন্টারনেট সংযোগ প্রয়োজন."""

changelog = '''
- স্থির: HTTP 429 হারের সীমা এবং বিশ্বব্যাপী Google অনুবাদ ব্লকিং (অনুবাদ এবং তাত্ক্ষণিক অনুবাদ বিভ্রাট উভয়ই ঠিক করা) বাইপাস করতে মাল্টি-টায়ার Google এন্ডপয়েন্ট ফেইলওভার।
- স্থির: মাল্টি-ফরম্যাট রেসপন্স পার্সার ক্রোম এক্সটেনশন ডিকশনারি এন্ডপয়েন্ট এবং স্ট্যান্ডার্ড ট্রান্সলেশন ব্যাচ খণ্ড সমর্থন করে।
- কর্মক্ষমতা: অতি দ্রুত সাব-100ms রিয়েল-টাইম অনুবাদের জন্য একাধিক Google এজ নোড জুড়ে SSL সংযোগ পুলিং।
