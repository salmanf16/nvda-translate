summary = "অনুবাদ করুন"
description = """এনভিডিএর জন্য একটি অতি-দ্রুত এবং লাইটওয়েট অনলাইন অনুবাদ অ্যাডন। মূলত Yannick Plassiard দ্বারা তৈরি, এই পরিবর্তিত সংস্করণটি উচ্চ-গতির ক্লাউড ইঞ্জিন ব্যবহার করে দ্রুত রিয়েল-টাইম অনুবাদের জন্য অপ্টিমাইজ করা হয়েছে। বিশেষ ধন্যবাদ এবং সম্পূর্ণ কৃতিত্ব মূল বিকাশকারীকে তার ব্যতিক্রমী কাজের জন্য। একটি ইন্টারনেট সংযোগ প্রয়োজন."""

changelog = '''
