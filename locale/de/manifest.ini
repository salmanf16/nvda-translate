summary = "Übersetzen"
description = """Ein ultraschnelles und leichtes Online-Übersetzungs-Add-on für NVDA. Ursprünglich von Yannick Plassiard erstellt, wurde diese modifizierte Version für schnelle Echtzeitübersetzungen mithilfe von Hochgeschwindigkeits-Cloud-Engines optimiert. Besonderer Dank und volle Anerkennung gebührt dem ursprünglichen Entwickler für seine außergewöhnliche Arbeit. Erfordert eine Internetverbindung."""

changelog = '''
- Behoben: Mehrstufiges Google-Endpunkt-Failover zur Umgehung von HTTP 429-Ratenbegrenzungen und globaler Google Translate-Blockierung (Behebung von Ausfällen bei Translate und Instant Translate).
- Behoben: Multiformat-Antwortparser, der Chrome-Erweiterungswörterbuch-Endpunkte und Standard-Übersetzungs-Batch-Blöcke unterstützt.
- Leistung: SSL-Verbindungspooling über mehrere Google-Edge-Knoten für ultraschnelle Echtzeitübersetzung unter 100 ms.
'''
