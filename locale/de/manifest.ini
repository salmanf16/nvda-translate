summary = "Übersetzen"
description = """Ein ultraschnelles und leichtes Online-Übersetzungs-Add-on für NVDA. Ursprünglich von Yannick Plassiard erstellt, wurde diese modifizierte Version für schnelle Echtzeitübersetzungen mithilfe von Hochgeschwindigkeits-Cloud-Engines optimiert. Besonderer Dank und volle Anerkennung gebührt dem ursprünglichen Entwickler für seine außergewöhnliche Arbeit. Erfordert eine Internetverbindung."""

changelog = '''
- Hinzugefügt: Unterstützung für Google Gemini (gemini-3.5-flash), OpenAI ChatGPT (gpt-5.4-mini) und DeepL-Übersetzungs-Engines mit dynamischem Modellabruf in den Einstellungen.
- Hinzugefügt: Ukrainische Übersetzung beigesteuert von George-br.
- Behoben: Übersetzungen funktionieren jetzt beim kontinuierlichen Lesen (Alles sagen) korrekt.
- Geändert: Automatische maschinelle Übersetzung für von Menschen übersetzte Gebietsschemas deaktiviert, um manuelle Übersetzungen zu schützen.
'''
