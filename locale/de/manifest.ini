summary = "Übersetzen"
description = """Ein ultraschnelles und leichtes Online-Übersetzungs-Add-on für NVDA. Ursprünglich von Yannick Plassiard erstellt, wurde diese modifizierte Version für schnelle Echtzeitübersetzungen mithilfe von Hochgeschwindigkeits-Cloud-Engines optimiert. Besonderer Dank und volle Anerkennung gebührt dem ursprünglichen Entwickler für seine außergewöhnliche Arbeit. Erfordert eine Internetverbindung."""

changelog = '''
- Fixed: Multi-Tier Google Endpoint Failover to bypass HTTP 429 rate limits and global Google Translate blocking (fixing both Translate and Instant Translate outages).
- Fixed: Multi-format response parser supporting Chrome extension dictionary endpoints and standard translation batch chunks.
- Performance: SSL connection pooling across multiple Google edge nodes for ultra-fast sub-100ms real-time translation.
