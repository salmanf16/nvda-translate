summary = "Übersetzen"
description = """Ein ultraschnelles und leichtes Online-Übersetzungs-Add-on für NVDA. Ursprünglich von Yannick Plassiard erstellt, wurde diese modifizierte Version für schnelle Echtzeitübersetzungen mithilfe von Hochgeschwindigkeits-Cloud-Engines optimiert. Besonderer Dank und volle Anerkennung gebührt dem ursprünglichen Entwickler für seine außergewöhnliche Arbeit. Erfordert eine Internetverbindung."""

changelog = '''
- Behoben: Verbesserte automatische Erkennung mehrerer Sprachen für Spiele mit lateinischer Schrift (Spanisch, Französisch, Deutsch, Italienisch, Portugiesisch usw.), um eine genaue Übersetzung in die Zielsprache zu ermöglichen.
- Leistung: Bereinigter und optimierter Übersetzungscache, um veraltete transkribierte Begriffe zu verhindern.
- Behoben: Quellsprachen-Routing für ASCII-Spieltext.
'''
