summary = "ترجمة"
description = """إضافة ترجمة فورية فائقة السرعة لبرنامج NVDA. هذا الإصدار عبارة عن تعديل وتطوير للنسخة الأصلية لتقديم ترجمة سريعة للغاية. كل الشكر والتقدير للمطور الأصلي Yannick Plassiard على إضافة الترجمة الرائعة وتسهيل وصولها، حيث لا يمكننا نسيان فضله وحقه كمطور أصلي لهذا العمل. تتطلب الإضافة اتصالاً بالإنترنت."""
