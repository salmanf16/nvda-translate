summary = "Tłumaczyć"
description = """Ultraszybki i lekki dodatek do tłumaczenia online dla NVDA. Ta zmodyfikowana wersja, pierwotnie stworzona przez Yannicka Plassiarda, została zoptymalizowana pod kątem szybkich tłumaczeń w czasie rzeczywistym przy użyciu szybkich silników chmurowych. Specjalne podziękowania i pełne uznanie należą się oryginalnemu programiście za jego wyjątkową pracę. Wymaga połączenia z Internetem."""

changelog = '''
- Naprawiono: Ulepszone automatyczne wykrywanie wielu języków w grach z alfabetem łacińskim (hiszpański, francuski, niemiecki, włoski, portugalski itp.), aby dokładnie tłumaczyć na język docelowy.
- Wydajność: oczyszczona i zoptymalizowana pamięć podręczna tłumaczeń, aby zapobiec przestarzałym transliterowanym terminom.
- Naprawiono: Routing języka źródłowego dla tekstu gry ASCII.
'''
