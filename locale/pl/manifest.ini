summary = "Tłumaczyć"
description = """Ultraszybki i lekki dodatek do tłumaczenia online dla NVDA. Ta zmodyfikowana wersja, pierwotnie stworzona przez Yannicka Plassiarda, została zoptymalizowana pod kątem szybkich tłumaczeń w czasie rzeczywistym przy użyciu szybkich silników chmurowych. Specjalne podziękowania i pełne uznanie należą się oryginalnemu programiście za jego wyjątkową pracę. Wymaga połączenia z Internetem."""

changelog = '''
- Dodano: Wsparcie dla Google Gemini (gemini-3.5-flash), OpenAI ChatGPT (gpt-5.4-mini) i silników tłumaczących DeepL z dynamicznym pobieraniem modelu w ustawieniach.
- Dodano: tłumaczenie ukraińskie, którego autorem jest George-br.
- Naprawiono: Tłumaczenia działają teraz poprawnie podczas ciągłego czytania (Powiedz wszystko).
- Zmieniono: Wyłączono automatyczne tłumaczenie maszynowe dla języków tłumaczonych przez człowieka, aby chronić tłumaczenia ręczne.
