summary = "翻訳する"
description = """NVDA 用の超高速かつ軽量のオンライン翻訳アドオン。元々は Yannick Plassiard によって作成されましたが、この修正バージョンは、高速クラウド エンジンを使用した迅速なリアルタイム翻訳用に最適化されています。オリジナル開発者の並外れた功績に特別な感謝と全面的な敬意を表します。インターネット接続が必要です。"""

changelog = '''
- 修正: HTTP 429 レート制限とグローバル Google 翻訳ブロックをバイパスするための多層 Google エンドポイント フェイルオーバー (翻訳とインスタント翻訳の両方の停止を修正)。
- 修正: Chrome 拡張辞書エンドポイントと標準翻訳バッチ チャンクをサポートするマルチフォーマット レスポンス パーサー。
- パフォーマンス: 複数の Google エッジ ノードにわたる SSL 接続プーリングにより、100 ミリ秒未満の超高速リアルタイム翻訳を実現します。
'''
