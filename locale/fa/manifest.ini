summary = "ترجمه کنید"
description = """یک افزونه ترجمه آنلاین فوق العاده سریع و سبک برای NVDA. این نسخه اصلاح شده که در اصل توسط Yannick Plassiard ساخته شده است، برای ترجمه های سریع در زمان واقعی با استفاده از موتورهای ابری پرسرعت بهینه شده است. تشکر ویژه و اعتبار کامل به توسعه دهنده اصلی برای کار استثنایی اش. نیاز به اتصال به اینترنت دارد."""
