summary = "Tradurre"
description = """Un componente aggiuntivo di traduzione online ultraveloce e leggero per NVDA. Creata originariamente da Yannick Plassiard, questa versione modificata è stata ottimizzata per traduzioni rapide in tempo reale utilizzando motori cloud ad alta velocità. Un ringraziamento speciale e tutto il merito vanno allo sviluppatore originale per il suo lavoro eccezionale. Richiede una connessione Internet."""

changelog = '''
- Funzionalità: timeout della traduzione personalizzabile dall'utente nel pannello Impostazioni di NVDA (1 - 30 secondi).
- Risolto: rilevamento automatico del motore neurale al 100% in tutte le lingue (risolve i problemi relativi alla lingua di destinazione inglese e ai problemi di interpretazione degli script).
- Risolto: protezione della cache di memoria per impedire ai timeout di rete di bloccare il testo non tradotto in memoria.
- Risolto: timeout rigorosi del socket HTTP su tutti i motori cloud e AI (DeepL, OpenAI, Gemini, Bing, OpenRouter, LibreTranslate, Lingva).
- Risolto: salvaguardia di fallback per i segnaposto dei numeri di modello se alterati dai motori di traduzione.
- Prestazioni: architettura rigorosa del pacchetto whitelist che riduce le dimensioni dei componenti aggiuntivi a ~79 KB.
'''
