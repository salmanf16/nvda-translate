summary = "Tradurre"
description = """Un componente aggiuntivo di traduzione online ultraveloce e leggero per NVDA. Creata originariamente da Yannick Plassiard, questa versione modificata è stata ottimizzata per traduzioni rapide in tempo reale utilizzando motori cloud ad alta velocità. Un ringraziamento speciale e tutto il merito vanno allo sviluppatore originale per il suo lavoro eccezionale. Richiede una connessione Internet."""

changelog = '''
- Risolto: failover multilivello di Google Endpoint per bypassare i limiti di velocità HTTP 429 e il blocco globale di Google Translate (correzione delle interruzioni di Translate e Instant Translate).
- Risolto: parser di risposta multiformato che supporta endpoint del dizionario dell'estensione Chrome e blocchi batch di traduzione standard.
- Prestazioni: pooling di connessioni SSL su più nodi periferici di Google per una traduzione ultraveloce in tempo reale inferiore a 100 ms.
'''
