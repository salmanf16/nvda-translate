summary = "번역하다"
description = """NVDA를 위한 초고속 및 경량 온라인 번역 애드온입니다. 원래 Yannick Plassiard가 만든 이 수정 버전은 고속 클라우드 엔진을 사용하여 신속한 실시간 번역에 최적화되었습니다. 탁월한 작업을 수행한 원래 개발자에게 특별한 감사와 전적인 감사를 표합니다. 인터넷 연결이 필요합니다."""

changelog = '''
- 수정됨: HTTP 429 속도 제한 및 글로벌 Google 번역 차단을 우회하는 다중 계층 Google 엔드포인트 장애 조치(번역 및 즉시 번역 중단 문제 해결).
- 수정됨: Chrome 확장 프로그램 사전 끝점 및 표준 번역 일괄 청크를 지원하는 다중 형식 응답 파서.
- 성능: 100ms 미만의 초고속 실시간 번역을 위해 여러 Google 에지 노드에 걸쳐 SSL 연결 풀링을 제공합니다.
