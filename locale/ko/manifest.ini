summary = "번역하다"
description = """NVDA를 위한 초고속 및 경량 온라인 번역 애드온입니다. 원래 Yannick Plassiard가 만든 이 수정 버전은 고속 클라우드 엔진을 사용하여 신속한 실시간 번역에 최적화되었습니다. 탁월한 작업을 수행한 원래 개발자에게 특별한 감사와 전적인 감사를 표합니다. 인터넷 연결이 필요합니다."""

changelog = '''
- 수정됨: 라틴어 스크립트 게임(스페인어, 프랑스어, 독일어, 이탈리아어, 포르투갈어 등)에 대한 다중 언어 자동 감지 기능이 향상되어 대상 언어로 정확하게 번역됩니다.
- 성능: 오래된 음역 용어를 방지하기 위해 번역 캐시를 정리하고 최적화했습니다.
- 수정됨: ASCII 게임 텍스트의 소스 언어 라우팅.
'''
