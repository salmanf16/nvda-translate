- Corrigé : analyseur de réponses multiformat prenant en charge les points de terminaison du dictionnaire d'extension Chrome et les morceaux de lots de traduction standard.
- Performances : regroupement de connexions SSL sur plusieurs nœuds périphériques Google pour une traduction ultra-rapide en temps réel inférieure à 100 ms.
